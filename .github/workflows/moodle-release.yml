name: Release Plugin version to Moodle Marketplace

# Calls Moodle HQ's reusable workflow: https://github.com/moodlehq/moodle-plugin-release
# It builds the zip from the tag and submits it to Moodle Marketplace. Release notes come
# from the GitHub Release for the tag, falling back to CHANGES.md.
#
# Pinned to a commit because the called workflow receives the Marketplace token. To update,
# replace the SHA with the latest commit on moodlehq/moodle-plugin-release main.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v1.4.0)'
        required: true

jobs:
  release-to-marketplace:
    # Revision 2026101401.
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@7c56bd9ce7b0a3125459924e7bd08570d41b9aa3
    with:
      tag: ${{ inputs.tag }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
